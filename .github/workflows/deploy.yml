# Auto-Deploy: jeder Push auf main → Cloudflare Workers (Free Tier, $0).
# Benötigte Repository-Secrets (siehe VEROEFFENTLICHEN.md §3b):
#   CLOUDFLARE_API_TOKEN  (Template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID (Dashboard → rechts auf der Overview-Seite)
#
# Das Gate liegt in .github/workflows/verify.yml und wird hier aufgerufen –
# dieselbe Kette läuft dadurch bei jedem Pull Request (dort ohne Deploy).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  gate:
    # Ruft das PR-Gate auf: Build → Server → `npm run verify`.
    # Scheitert es, wird der Deploy-Job übersprungen (kein halber Deploy).
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Der Deploy ist erst fertig, wenn die Domain ihn auch ausliefert.
      # Prüft genau die §5-Checkliste aus VEROEFFENTLICHEN.md – als Befehl:
      # Sitemap (30 URLs), hreflang, Canonicals, robots/googlebot, JSON-LD,
      # OG-Karte, 404-Verhalten, Header, alle fünf Sprachen und die
      # Domain-Regeln (Always HTTPS, www → apex).
      - name: Auf die Domain warten (Deploy-Propagation)
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L https://nodechart.cc/de || true)
            if [ "$code" = "200" ]; then
              echo "nodechart.cc liefert 200 nach ${attempt}s"
              exit 0
            fi
            echo "Versuch ${attempt}: HTTP ${code}"
            sleep 5
          done
          echo "::error::nodechart.cc antwortet nach 5 Minuten nicht mit 200"
          exit 1

      - name: Live-Endkontrolle (npm run check:live)
        run: npm run check:live
