# Auto-Deploy: jeder Push auf main → Cloudflare Workers (Free Tier, $0).
# Benötigte Repository-Secrets (siehe VEROEFFENTLICHEN.md §3b):
#   CLOUDFLARE_API_TOKEN  (Template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID (Dashboard → rechts auf der Overview-Seite)
#
# Das Gate liegt in .github/workflows/verify.yml und wird hier aufgerufen –
# dieselbe Kette läuft dadurch bei jedem Pull Request (dort ohne Deploy).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  gate:
    # Ruft das PR-Gate auf: Build → Server → `npm run verify`.
    # Scheitert es, wird der Deploy-Job übersprungen (kein halber Deploy).
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
